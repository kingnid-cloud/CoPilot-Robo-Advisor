name: Manual Backtest Run
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date for backtest (YYYY-MM-DD)'
        required: false
        default: '2000-01-01'
      end:
        description: 'End date for backtest (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      train_years:
        description: 'Training window in years'
        required: false
        default: '5'
      test_months:
        description: 'Test window in months'
        required: false
        default: '6'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install statsmodels hmmlearn scikit-learn pandas-datareader scikit-fuzzy ta matplotlib yfinance

      - name: Run compare backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          START=${{ github.event.inputs.start || '2000-01-01' }}
          END=${{ github.event.inputs.end || '2025-01-01' }}
          TRAIN=${{ github.event.inputs.train_years || '5' }}
          TEST=${{ github.event.inputs.test_months || '6' }}
          python -m src.backtest.compare_and_plot --tickers SPY --start "$START" --end "$END" --train-years "$TRAIN" --test-months "$TEST" --out outputs/backtest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-artifacts
          path: outputs/backtest.*
