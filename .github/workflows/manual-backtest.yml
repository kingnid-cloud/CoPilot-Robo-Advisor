name: Manual Backtest Run
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date for backtest (YYYY-MM-DD)'
        required: false
        default: '2000-01-01'
      end:
        description: 'End date for backtest (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      train_years:
        description: 'Training window in years'
        required: false
        default: '5'
      test_months:
        description: 'Test window in months'
        required: false
        default: '6'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install statsmodels hmmlearn scikit-learn pandas-datareader scikit-fuzzy ta matplotlib yfinance requests

      - name: Tickerbot quick check
        env:
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          TICKERBOT_URL: ${{ secrets.TICKERBOT_URL }}
        run: |
          echo "Tickerbot base: $TICKERBOT_URL"
          echo "Requesting SPY history (2005-01-01..2005-06-30) -> /v2/tickers/{ticker}/history (asof)"
          curl -i -sS -H "Authorization: Bearer $TICKERBOT_API_KEY" \
            "$TICKERBOT_URL/v2/tickers/SPY/history?interval=1d&asof=2005-06-30" | sed -n '1,200p' || true
          echo
          echo "Trying alternative (fallback) endpoint: /v2/tickers/{ticker}/series (kept for debug)"
          curl -i -sS -H "Authorization: Bearer $TICKERBOT_API_KEY" \
            "$TICKERBOT_URL/v2/tickers/SPY/series?start=2005-01-01&end=2005-06-30&granularity=d" | sed -n '1,200p' || true
          echo
          echo "Trying fallback endpoint: /v1/tickers/{ticker}/series"
          curl -i -sS -H "Authorization: Bearer $TICKERBOT_API_KEY" \
            "$TICKERBOT_URL/v1/tickers/SPY/series?start=2005-01-01&end=2005-06-30&granularity=d" | sed -n '1,200p' || true

      - name: Run compare backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TICKERBOT_URL: ${{ secrets.TICKERBOT_URL }}
        run: |
          START=${{ github.event.inputs.start || '2000-01-01' }}
          END=${{ github.event.inputs.end || '2025-01-01' }}
          TRAIN=${{ github.event.inputs.train_years || '5' }}
          TEST=${{ github.event.inputs.test_months || '6' }}
          python -m src.backtest.compare_and_plot --tickers SPY --start "$START" --end "$END" --train-years "$TRAIN" --test-months "$TEST" --out outputs/backtest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-artifacts
          path: |
            outputs/backtest.*
            outputs/debug/**
