name: Manual Backtest Run

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date for backtest (YYYY-MM-DD)'
        required: false
        default: '2000-01-01'
      end:
        description: 'End date for backtest (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      train_years:
        description: 'Training window in years'
        required: false
        default: '5'
      test_months:
        description: 'Test window in months'
        required: false
        default: '6'
      source_mode:
        description: 'Data source mode (auto/tickerbot/snapshot/fmp/yf)'
        required: false
        default: 'auto'

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install statsmodels hmmlearn scikit-learn pandas-datareader scikit-fuzzy ta matplotlib yfinance requests

      - name: Tickerbot quick check
        env:
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          TICKERBOT_URL: ${{ secrets.TICKERBOT_URL }}
        run: |
          echo "Tickerbot base: $TICKERBOT_URL"
          echo "Requesting SPY daily price series (2005-01-01..2005-06-30) via /v2/series"
          curl -i -sS -H "Authorization: Bearer $TICKERBOT_API_KEY" \
            "$TICKERBOT_URL/v2/series?tickers=SPY&columns=price&interval=1d&from=2005-01-01&to=2005-06-30" | sed -n '1,200p' || true
          echo
          echo "Requesting SPY snapshot as-of 2005-06-30 via /v2/tickers/{ticker}?asof="
          curl -i -sS -H "Authorization: Bearer $TICKERBOT_API_KEY" \
            "$TICKERBOT_URL/v2/tickers/SPY?asof=2005-06-30" | sed -n '1,200p' || true

      - name: Run compare backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TICKERBOT_URL: ${{ secrets.TICKERBOT_URL }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: |
          START=${{ github.event.inputs.start || '2000-01-01' }}
          END=${{ github.event.inputs.end || '2025-01-01' }}
          TRAIN=${{ github.event.inputs.train_years || '5' }}
          TEST=${{ github.event.inputs.test_months || '6' }}
          SOURCE_MODE=${{ github.event.inputs.source_mode || 'auto' }}
          python -m src.backtest.compare_and_plot \
            --tickers SPY \
            --start "$START" \
            --end "$END" \
            --train-years "$TRAIN" \
            --test-months "$TEST" \
            --out outputs/backtest \
            --source-mode "$SOURCE_MODE"

      - name: Email backtest results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Walk-Forward Backtest Results"
          to: ${{ secrets.TO_EMAIL }}
          from: "Backtest Bot <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Hello Nidal,

            Your walk-forward backtest has completed successfully.

            Attached:
            - Equity curve (strategy vs SPY/QQQ/VT)
            - Fold-level returns
            - Data quality heatmap
            - Rolling Sharpe ratio
            - CSV results
            - JSON fold summary

            Best,
            Copilot Backtest Engine
          attachments: |
            outputs/backtest.equity.png
            outputs/backtest.folds.png
            outputs/backtest.quality.png
            outputs/backtest.sharpe.png
            outputs/backtest.csv
            outputs/backtest.folds.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-artifacts
          path: |
            outputs/backtest.*
            outputs/debug/**
            outputs/cache/**
