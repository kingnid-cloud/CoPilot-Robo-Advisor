name: Manual Backtest Run
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date for backtest (YYYY-MM-DD)'
        required: false
        default: '2000-01-01'
      end:
        description: 'End date for backtest (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      train_years:
        description: 'Training window in years'
        required: false
        default: '5'
      test_months:
        description: 'Test window in months'
        required: false
        default: '6'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install statsmodels hmmlearn scikit-learn pandas-datareader scikit-fuzzy ta matplotlib yfinance requests

      - name: Diagnostics: capture raw provider responses
        env:
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          TICKERBOT_URL: ${{ secrets.TICKERBOT_URL }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import calendar
          from datetime import datetime
          import yfinance as yf
          import pandas as pd
          import pandas_datareader.data as pdr
          import socket

          # Representative date window for a fold
          s = "2005-01-01"
          e = "2005-06-30"

          print("=== ENV PRESENCE ===")
          print("ALPHAVANTAGE_KEY:", "PRESENT" if os.getenv("ALPHAVANTAGE_KEY") else "MISSING")
          print("TICKERBOT_API_KEY:", "PRESENT" if os.getenv("TICKERBOT_API_KEY") else "MISSING")
          print("TICKERBOT_URL:", os.getenv("TICKERBOT_URL", "not set; default will be used in code"))

          # 1) Raw Yahoo CSV endpoint
          try:
              period1 = int(calendar.timegm(datetime.strptime(s, "%Y-%m-%d").timetuple()))
              period2 = int(calendar.timegm(datetime.strptime(e, "%Y-%m-%d").timetuple())) + 24*3600
              yahoo_url = (
                  f"https://query1.finance.yahoo.com/v7/finance/download/SPY"
                  f"?period1={period1}&period2={period2}&interval=1d&events=history&includeAdjustedClose=true"
              )
              print("\n=== RAW YAHOO CSV CHECK ===")
              print("URL:", yahoo_url)
              r = requests.get(yahoo_url, timeout=30)
              print("status:", r.status_code)
              print("headers (sample):", dict(list(r.headers.items())[:6]))
              print("body (first 1000 chars):")
              print(r.content[:1000].decode('utf-8', errors='replace'))
          except Exception as exc:
              print("RAW YAHOO ERROR:", exc)

          # 2) yfinance tests
          try:
              print("\n=== YFINANCE yf.download ===")
              try:
                  df = yf.download(
                      "SPY",
                      start=s,
                      end=(pd.to_datetime(e) + pd.Timedelta(days=1)).strftime("%Y-%m-%d"),
                      progress=False,
                      threads=False,
                  )
              except TypeError:
                  df = yf.download(
                      "SPY",
                      start=s,
                      end=(pd.to_datetime(e) + pd.Timedelta(days=1)).strftime("%Y-%m-%d"),
                  )
              print("yf.download shape:", None if df is None else df.shape)
          except Exception as exc:
              print("yf.download exception:", exc)

          try:
              print("\n=== YFINANCE Ticker.history ===")
              tk = yf.Ticker("SPY")
              h = tk.history(
                  start=s,
                  end=(pd.to_datetime(e) + pd.Timedelta(days=1)).strftime("%Y-%m-%d"),
              )
              print("Ticker.history shape:", None if h is None else h.shape)
          except Exception as exc:
              print("Ticker.history exception:", exc)

          # 3) pandas_datareader / stooq test
          try:
              print("\n=== STOOQ (pandas_datareader) ===")
              ds = pdr.DataReader("SPY", "stooq", start=s, end=e)
              print("stooq shape:", None if ds is None else ds.shape)
          except Exception as exc:
              print("stooq exception:", exc)

          # 4) Tickerbot API test
          try:
              print("\n=== TICKERBOT API ===")
              base = os.getenv("TICKERBOT_URL", "https://api.tickerbot.io").rstrip("/")
              key = os.getenv("TICKERBOT_API_KEY", "")
              url = f"{base}/v1/tickers/SPY/series"
              headers = {"Authorization": f"Bearer {key}"} if key else {}
              r = requests.get(url, params={"start": s, "end": e, "granularity": "d"}, headers=headers, timeout=30)
              print("Tickerbot URL:", r.url)
              print("status:", r.status_code)
              print("headers (sample):", dict(list(r.headers.items())[:6]))
              print("body (first 1000 chars):")
              print(r.content[:1000].decode("utf-8", errors="replace"))
          except Exception as exc:
              print("Tickerbot exception:", exc)

          # 5) Quick DNS/resolution check
          try:
              print("\n=== NETWORK/DNS CHECK ===")
              for host in ("query1.finance.yahoo.com", "stooq.com", "api.tickerbot.io"):
                  try:
                      print(host, "->", socket.getaddrinfo(host, 443)[:1])
                  except Exception as exc:
                      print(host, "DNS error:", exc)
          except Exception:
              pass

          PY

      - name: Run compare backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TICKERBOT_URL: ${{ secrets.TICKERBOT_URL }}
        run: |
          START=${{ github.event.inputs.start || '2000-01-01' }}
          END=${{ github.event.inputs.end || '2025-01-01' }}
          TRAIN=${{ github.event.inputs.train_years || '5' }}
          TEST=${{ github.event.inputs.test_months || '6' }}
          python -m src.backtest.compare_and_plot --tickers SPY --start "$START" --end "$END" --train-years "$TRAIN" --test-months "$TEST" --out outputs/backtest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-artifacts
          path: outputs/backtest.*
