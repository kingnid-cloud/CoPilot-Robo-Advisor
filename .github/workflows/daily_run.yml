name: Daily Robo Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # daily at 12:00 UTC

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # try fallbacks for known problematic packages
          pip install ta==0.12.0 || pip install ta==0.11.0
          pip install logdna==2.0.0 || pip install logdna==1.18.12
          pip install -r requirements.txt --no-deps || true
          pip install -r requirements.txt

      - name: Run daily pipeline (produce report)
        env:
          # Market data
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}

          # Brokerage / test accounts (if needed)
          RH_TEST_ACCOUNT_NUMBER: ${{ secrets.RH_TEST_ACCOUNT_NUMBER }}
          RH_TEST_EMAIL: ${{ secrets.RH_TEST_EMAIL }}
          RH_TEST_PASSWORD: ${{ secrets.RH_TEST_PASSWORD }}

          # Feature flags
          ENABLE_LIVE: ${{ secrets.ENABLE_LIVE }}
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}

          # Observability
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOGDNA_KEY: ${{ secrets.LOGDNA_KEY }}
        run: |
          # Run the repo's daily pipeline; ensure it writes a report to reports/
          python -m src.run_daily --config config.yaml

      - name: Fail if browsing metadata present in report
        run: |
          REPORT="reports/daily_screening.csv"
          if [ -f "$REPORT" ]; then
            if grep -q "edge_all_open_tabs" "$REPORT" || grep -q "WebsiteContent_yivqn" "$REPORT"; then
              echo "Found browsing metadata in $REPORT — aborting send."
              exit 1
            fi
          else
            echo "Report not found at $REPORT; skipping metadata check."
          fi

      - name: Send report by email (Gmail)
        if: always()
        env:
          # SMTP host/port (Gmail defaults)
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: 587

          # Preferred Gmail secrets
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Fallback secret names (if you used different names)
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          EMAILAPPPASSWORD: ${{ secrets.EMAILAPPPASSWORD }}

          # From / To
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          REPORT_FILE="reports/daily_screening.csv"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "Report not found at $REPORT_FILE"
            ls -la reports || true
            exit 2
          fi
          python scripts/send_report_email.py --file "$REPORT_FILE" --subject "CoPilot Stock Report"

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-reports
          path: reports/
