name: Daily Robo Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # daily at 12:00 UTC

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run daily pipeline (produce reports)
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}
          RH_TEST_ACCOUNT_NUMBER: ${{ secrets.RH_TEST_ACCOUNT_NUMBER }}
          RH_TEST_EMAIL: ${{ secrets.RH_TEST_EMAIL }}
          RH_TEST_PASSWORD: ${{ secrets.RH_TEST_PASSWORD }}
          ENABLE_LIVE: ${{ secrets.ENABLE_LIVE }}
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOGDNA_KEY: ${{ secrets.LOGDNA_KEY }}
        run: |
          # Run the repo's daily pipeline; ensure it writes reports into reports/
          python -m src.run_daily --config config.yaml || true

      - name: Debug reports directory
        run: |
          echo "Listing reports/"
          ls -la reports || true

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-reports
          path: reports/

      - name: Find report file
        id: find_report
        run: |
          # Find first matching report file (csv, xlsx, parquet, json)
          REPORT=$(ls reports/*.{csv,xlsx,parquet,json} 2>/dev/null | head -n 1 || true)
          if [ -z "$REPORT" ]; then
            echo "report_path="
          else
            echo "report_path=$REPORT"
          fi
        shell: bash

      - name: Upload single report to S3 with deterministic key
        if: always() && env.AWS_S3_BUCKET
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          REPORT="${{ steps.find_report.outputs.report_path }}"
          if [ -z "$REPORT" ]; then
            echo "No report found; skipping S3 upload."
            exit 0
          fi
          DATE=$(date -u +"%Y-%m-%d")
          RUN_ID=${{ github.run_id }}
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:8}
          BASENAME=$(basename "$REPORT")
          KEY="daily-reports/${RUN_ID}/${DATE}_${SHORT_SHA}_${BASENAME}"
          echo "Uploading $REPORT to s3://${AWS_S3_BUCKET}/${KEY}"
          python -m pip install --upgrade awscli
          aws s3 cp "$REPORT" "s3://${AWS_S3_BUCKET}/${KEY}" --region "${AWS_REGION}"
        shell: bash

      - name: Generate summary and email (no attachments)
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python -m pip install --upgrade pandas numpy || true
          REPORT_PATH="${{ steps.find_report.outputs.report_path }}"
          if [ -z "$REPORT_PATH" ]; then
            echo "No report found; sending notification email with status only."
            python scripts/send_report_email.py --file /dev/null --subject "CoPilot Stock Report" --body "No report produced in this run. Check artifacts for details."
            exit 0
          fi
          python scripts/format_and_email_summary.py --path reports/ --subject "CoPilot Stock Report"
        shell: bash
