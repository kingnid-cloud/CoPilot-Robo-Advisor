name: Daily Robo Run

on:
  schedule:
    - cron: '0 14 * * 1-5'  # Runs Monday-Friday at 14:00 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily pipeline
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ENABLE_LIVE: ${{ secrets.ENABLE_LIVE }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
        run: |
          python -m src.run_daily --config config.yaml
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: robo-reports
          path: reports/*
