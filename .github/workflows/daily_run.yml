name: Daily Robo Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # daily at 12:00 UTC

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SMTP test (diagnostic)
        env:
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASS: ${{ secrets.EMAIL_SMTP_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python scripts/smtp_test.py
      - name: Run daily pipeline
        

          # Market data / fundamentals / alternative data APIs
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          TICKERBOT_API_KEY: ${{ secrets.TICKERBOT_API_KEY }}

          # Brokerage / test accounts
          RH_TEST_ACCOUNT_NUMBER: ${{ secrets.RH_TEST_ACCOUNT_NUMBER }}
          RH_TEST_EMAIL: ${{ secrets.RH_TEST_EMAIL }}
          RH_TEST_PASSWORD: ${{ secrets.RH_TEST_PASSWORD }}

          # Feature flags / runtime toggles
          ENABLE_LIVE: ${{ secrets.ENABLE_LIVE }}
          ENABLE_EMAIL: ${{ secrets.ENABLE_EMAIL }}

          # Observability
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOGDNA_KEY: ${{ secrets.LOGDNA_KEY }}
        run: |
          python -m src.run_daily --config config.yaml

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-reports
          path: reports/
